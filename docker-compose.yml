services:
  lain:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: lain:latest
    container_name: lain
    restart: unless-stopped
    ports:
      - "${LAIN_HOST_PORT:-3000}:3000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://10.5.1.20:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_MODEL_DEEP=${OLLAMA_MODEL_DEEP:-gemma4:12b}
      - LAIN_OLLAMA_NUM_CTX=${LAIN_OLLAMA_NUM_CTX:-16384}
      - LAIN_OLLAMA_TIMEOUT_MS=${LAIN_OLLAMA_TIMEOUT_MS:-90000}
      - LAIN_HISTORY_LIMIT=${LAIN_HISTORY_LIMIT:-40}
      - LAIN_DB_PATH=/data/lain.db
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - ALLOWED_USERS=${ALLOWED_USERS}
      - LAIN_API_TOKEN=${LAIN_API_TOKEN}
      - LAIN_SYSTEM_PROMPT=${LAIN_SYSTEM_PROMPT}
      - LAIN_NEUTRAL_PROMPT=${LAIN_NEUTRAL_PROMPT}
      - LAIN_TOOLS_URL=${LAIN_TOOLS_URL}
      - LAIN_TOOLS_TOKEN=${LAIN_TOOLS_TOKEN}
      - LAIN_TIMEZONE=${LAIN_TIMEZONE:-America/Chicago}
      - TZ=${LAIN_TIMEZONE:-America/Chicago}
      - LAIN_NEWS_FEED_URL=${LAIN_NEWS_FEED_URL}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - LAIN_REMINDER_EMAIL_TO=${LAIN_REMINDER_EMAIL_TO}
      - LAIN_WIPE_PIN=${LAIN_WIPE_PIN:-0395}
    volumes:
      - lain-data:/data

volumes:
  lain-data:
